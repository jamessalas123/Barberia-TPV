<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A7F5A">
<title>Asistente virtual</title>
<style>
:root{--ink:#0F1720;--mut:#52647A;--brand:#0A7F5A;--bg:#E9EEF3;--card:#fff;--me:#D8F3E8;--line:#D5DDE6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:#F4F6F9;box-shadow:0 0 0 1px var(--line)}
header{background:var(--brand);color:#fff;padding:.7rem .9rem;padding-top:calc(.7rem + env(safe-area-inset-top));display:flex;align-items:center;gap:.7rem}
.av{width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;flex:none}
header b{display:block;font-size:1rem;line-height:1.15}
header small{font-size:.74rem;opacity:.9}
.aviso{background:#FFF3C9;color:#5C4300;font-size:.74rem;font-weight:600;padding:.35rem .9rem;text-align:center}
#chat{flex:1;overflow-y:auto;padding:.9rem .75rem;display:flex;flex-direction:column;gap:.45rem}
.m{max-width:84%;padding:.5rem .7rem;border-radius:.9rem;font-size:.93rem;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.m.bot{align-self:flex-start;background:var(--card);border-top-left-radius:.25rem}
.m.yo{align-self:flex-end;background:var(--me);border-top-right-radius:.25rem}
.m strong{font-weight:800}
.escribiendo{align-self:flex-start;background:var(--card);border-radius:.9rem;border-top-left-radius:.25rem;padding:.55rem .8rem;display:flex;gap:.25rem}
.escribiendo i{width:.45rem;height:.45rem;border-radius:50%;background:#9AA8B8;animation:b 1s infinite}
.escribiendo i:nth-child(2){animation-delay:.15s}.escribiendo i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;padding:0 .75rem .5rem}
.chips button{background:#fff;border:1.5px solid var(--brand);color:var(--brand);border-radius:999px;padding:.35rem .75rem;font-size:.8rem;font-weight:700;cursor:pointer}
form{display:flex;gap:.5rem;padding:.6rem .7rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:.6rem .95rem;font-size:1rem;outline:none;background:#F4F6F9;color:var(--ink)}
input:focus{border-color:var(--brand);background:#fff}
form button{background:var(--brand);color:#fff;border:0;border-radius:999px;width:2.7rem;height:2.7rem;font-size:1.1rem;cursor:pointer;flex:none}
form button:disabled{opacity:.5}
.vacio{margin:auto;text-align:center;color:var(--mut);padding:2rem}
</style>
</head>
<body>
<div class="app">
  <header><div class="av" id="ini">?</div><div><b id="nom">Asistente virtual</b><small>Asistente virtual · en línea</small></div></header>
  <div class="aviso">Demostración: las citas que se reserven aquí son de prueba</div>
  <div id="chat"></div>
  <div class="chips" id="chips">
    <button type="button">¿Qué servicios tenéis?</button>
    <button type="button">Quiero una cita mañana por la tarde</button>
    <button type="button">Quiero hablar con una persona</button>
  </div>
  <form id="f" autocomplete="off"><input id="t" placeholder="Escribe un mensaje" maxlength="500" aria-label="Mensaje"><button id="b" aria-label="Enviar">➤</button></form>
</div>
<script>
(function(){
  var codigo=(new URLSearchParams(location.search).get('c')||'').toLowerCase();
  var KEY='demo_'+codigo, chat=document.getElementById('chat'), t=document.getElementById('t'), b=document.getElementById('b'), chips=document.getElementById('chips');
  var st={historial:[],citas:[],pantalla:[]};
  function guardar(){try{sessionStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
  function cargar(){try{var s=JSON.parse(sessionStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.pantalla))st=s;}catch(e){}}
  function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(x){return esc(x).replace(/\*([^*\n]+)\*/g,'<strong>$1</strong>');}
  function burbuja(rol,txt){var d=document.createElement('div');d.className='m '+rol;d.innerHTML=fmt(txt);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
  function escribiendo(on){var e=document.getElementById('esc');if(on&&!e){e=document.createElement('div');e.id='esc';e.className='escribiendo';e.innerHTML='<i></i><i></i><i></i>';chat.appendChild(e);chat.scrollTop=chat.scrollHeight;}else if(!on&&e)e.remove();}
  function error(msg){chat.innerHTML='<div class="vacio">'+esc(msg)+'</div>';document.getElementById('f').style.display='none';chips.style.display='none';}
  async function enviar(txt){
    txt=(txt||'').trim();if(!txt)return;
    burbuja('yo',txt);st.pantalla.push({r:'yo',t:txt});chips.style.display='none';t.value='';b.disabled=true;escribiendo(true);
    try{
      var r=await fetch('/api/demo-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({c:codigo,mensaje:txt,historial:st.historial,citas:st.citas})});
      var j=await r.json();escribiendo(false);
      if(!r.ok){burbuja('bot',j.error||'No puedo responder ahora mismo.');}
      else{st.historial=j.historial||[];st.citas=j.citas||[];burbuja('bot',j.respuesta);st.pantalla.push({r:'bot',t:j.respuesta});}
    }catch(e){escribiendo(false);burbuja('bot','Sin conexión. Inténtalo de nuevo.');}
    b.disabled=false;guardar();t.focus();
  }
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();enviar(t.value);});
  chips.addEventListener('click',function(e){if(e.target.tagName==='BUTTON')enviar(e.target.textContent);});
  if(!/^[a-z0-9-]{3,40}$/.test(codigo)){error('Enlace de demostración no válido.');return;}
  cargar();
  fetch('/api/demo-chat?c='+encodeURIComponent(codigo)).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){
    if(!x.ok){error(x.j.error||'Demostración no disponible.');return;}
    document.getElementById('nom').textContent=x.j.nombre;document.getElementById('ini').textContent=(x.j.nombre||'?').trim().charAt(0).toUpperCase();document.title=x.j.nombre+' · Asistente virtual';
    if(st.pantalla.length){st.pantalla.forEach(function(m){burbuja(m.r,m.t);});chips.style.display='none';}
    else{var s=x.j.saludo||('¡Hola! 😊 Soy el asistente virtual de '+x.j.nombre+'. Puedo ayudarte a pedir, consultar o cancelar una cita. ¿Qué necesitas?');burbuja('bot',s);st.pantalla.push({r:'bot',t:s});guardar();}
  }).catch(function(){error('No se pudo cargar la demostración.');});
})();
</script>
</body>
</html>
