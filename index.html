<!doctype html>
<html lang="es" style="color-scheme:dark;background-color:oklch(0.16 0.012 270)" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#1a1b23"/>
<title>Barbería TPV</title>
<style>
/* ══════════════════════════════════════════════════════════════
   BARBERÍA TPV v15 — Sistema de diseño OKLCH
   Tokens semánticos exactos según spec · sin colores hardcodeados
   ══════════════════════════════════════════════════════════════ */
:root {
  --radius:                 0.875rem;

  /* Superficies */
  --background:             oklch(0.16 0.012 270);
  --foreground:             oklch(0.97 0.005 270);
  --card:                   oklch(0.21 0.014 270);
  --card-foreground:        oklch(0.97 0.005 270);
  --popover:                oklch(0.21 0.014 270);
  --popover-foreground:     oklch(0.97 0.005 270);

  /* Marca — ÁMBAR */
  --primary:                oklch(0.78 0.16 75);
  --primary-foreground:     oklch(0.18 0.02 75);
  --primary-glow:           oklch(0.78 0.16 75 / 0.32);

  /* Neutros */
  --secondary:              oklch(0.27 0.016 270);
  --secondary-foreground:   oklch(0.97 0.005 270);
  --muted:                  oklch(0.25 0.012 270);
  --muted-foreground:       oklch(0.70 0.02  270);
  --accent:                 oklch(0.32 0.02  270);
  --accent-foreground:      oklch(0.97 0.005 270);

  /* Semánticos */
  --destructive:            oklch(0.62 0.22 25);
  --destructive-foreground: oklch(0.98 0.01 25);
  --destructive-glow:       oklch(0.62 0.22 25 / 0.30);
  --success:                oklch(0.68 0.18 145);
  --success-foreground:     oklch(0.15 0.02 145);
  --success-glow:           oklch(0.68 0.18 145 / 0.28);
  --warning:                oklch(0.78 0.16 75);
  --warning-foreground:     oklch(0.18 0.02 75);

  /* Estructurales */
  --border:                 oklch(0.30 0.014 270);
  --input:                  oklch(0.28 0.014 270);
  --ring:                   oklch(0.78 0.16 75);

  /* Radios escalados desde --radius (0.875rem = 14px) */
  --radius-sm:  calc(var(--radius) - 4px);   /* ≈ 10px */
  --radius-md:  calc(var(--radius) - 2px);   /* ≈ 12px */
  --radius-lg:  var(--radius);               /*   14px */
  --radius-xl:  calc(var(--radius) + 4px);   /* ≈ 18px */
  --radius-2xl: calc(var(--radius) + 8px);   /* ≈ 22px */
  --radius-3xl: calc(var(--radius) + 14px);  /* ≈ 28px */

  /* Charts */
  --chart-1: oklch(0.78 0.16 75);
  --chart-2: oklch(0.68 0.18 145);
  --chart-3: oklch(0.65 0.20 25);
  --chart-4: oklch(0.70 0.15 240);
  --chart-5: oklch(0.72 0.16 310);

  /* Nav colores por sección */
  --nav-agenda:          oklch(0.78 0.16 75);
  --nav-agenda-glow:     oklch(0.78 0.16 75 / 0.38);
  --nav-caja:            oklch(0.68 0.18 145);
  --nav-caja-glow:       oklch(0.68 0.18 145 / 0.38);
  --nav-analiticas:      oklch(0.70 0.15 240);
  --nav-analiticas-glow: oklch(0.70 0.15 240 / 0.38);
}

/* ── RESET GLOBAL ─────────────────────────────────────────────── */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-color: var(--border);
  -webkit-tap-highlight-color: transparent;
}
html, body, #root { height: 100%; }
body {
  background-color: var(--background);
  color: var(--foreground);
  font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  overscroll-behavior: none;
  color-scheme: dark;
  min-height: 100dvh;
  min-height: -webkit-fill-available;
}
input, textarea { user-select: text; -webkit-user-select: text; }
button { touch-action: manipulation; font-family: inherit; outline: none; border: none; cursor: pointer; }
input, select { font-family: inherit; outline: none; border: none; }

/* ── TOAST ────────────────────────────────────────────────────── */
.toast {
  position: fixed; top: 1.25rem; left: 50%; transform: translateX(-50%);
  z-index: 300; padding: .75rem 1.5rem; border-radius: var(--radius-2xl);
  font-weight: 700; font-size: .9rem;
  box-shadow: 0 8px 32px oklch(0 0 0 / 0.55);
  white-space: nowrap; pointer-events: none; color: var(--foreground);
}

/* ── SIDEBAR ──────────────────────────────────────────────────── */
.sidebar {
  width: 84px; height: 100vh;
  background: var(--card);
  border-right: 1px solid oklch(1 0 0 / 0.06);
  display: flex; flex-direction: column; align-items: center;
  padding: 1.25rem 0; gap: .25rem; flex-shrink: 0;
  box-shadow: 2px 0 24px oklch(0 0 0 / 0.45);
}

.logo-wrap {
  width: 56px; height: 56px;
  background: var(--primary);
  border-radius: var(--radius-2xl);
  display: grid; place-items: center;
  margin-bottom: 1.5rem;
  box-shadow: 0 4px 20px var(--primary-glow), 0 0 0 1.5px oklch(1 0 0 / 0.12);
  color: var(--primary-foreground);
}
.logo-wrap svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.nav-item {
  width: 62px; height: 62px;
  border-radius: var(--radius-2xl);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: .3rem; cursor: pointer;
  background: transparent;
  color: oklch(1 0 0 / 0.32);
  font-size: .5rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  transition: all .2s ease;
  border: none; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.nav-item svg {
  width: 28px; height: 28px;
  stroke: oklch(1 0 0 / 0.32);
  fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round;
  transition: stroke .2s ease;
}
.nav-item:hover { background: oklch(1 0 0 / 0.05); color: oklch(1 0 0 / 0.72); }
.nav-item:hover svg { stroke: oklch(1 0 0 / 0.72); }
.nav-item:active { transform: scale(.97); }

.nav-item.active { color: var(--foreground); background: transparent; }
.nav-item.active .nav-icon-wrap {
  background: var(--nav-color, var(--primary));
  box-shadow: 0 4px 20px var(--nav-glow, var(--primary-glow));
}
.nav-item.active svg { stroke: var(--primary-foreground); }

.nav-icon-wrap {
  width: 44px; height: 44px; border-radius: var(--radius-xl);
  display: grid; place-items: center;
  background: transparent;
  transition: background .2s, box-shadow .2s;
}
.nav-label {
  font-size: .48rem; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; line-height: 1;
}
.nav-spacer { flex: 1; }

.nav-out { color: oklch(1 0 0 / 0.22); }
.nav-out svg { stroke: oklch(1 0 0 / 0.22); }
.nav-out:hover { background: oklch(0.62 0.22 25 / 0.12); color: var(--destructive); }
.nav-suscribir { color: var(--primary); margin-bottom: .5rem; }
.nav-suscribir svg { fill: var(--primary); stroke: none; }
.nav-suscribir:hover { background: var(--primary-glow); box-shadow: 0 0 16px var(--primary-glow); }
.nav-out:hover svg { stroke: var(--destructive); }
.nav-out:hover .nav-icon-wrap { background: oklch(0.62 0.22 25 / 0.15); }

/* ── APP ──────────────────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }
.main { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

/* ── AUTH ─────────────────────────────────────────────────────── */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: var(--background); }
.auth-card {
  width: 100%; max-width: 400px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-3xl); padding: 2.25rem;
  box-shadow: 0 25px 50px oklch(0 0 0 / 0.55), 0 0 0 1px oklch(1 0 0 / 0.04);
}
.auth-logo {
  width: 64px; height: 64px;
  background: var(--primary);
  border-radius: var(--radius-2xl);
  display: grid; place-items: center;
  margin: 0 auto 1rem;
  box-shadow: 0 4px 28px var(--primary-glow), 0 0 0 1.5px oklch(1 0 0 / 0.12);
  color: var(--primary-foreground);
}
.auth-logo svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.auth-h1 { text-align: center; font-size: 1.625rem; font-weight: 800; margin-bottom: .25rem; color: var(--foreground); }
.auth-sub { text-align: center; color: var(--muted-foreground); font-size: .8rem; margin-bottom: 1.5rem; }
.auth-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: .375rem;
  background: var(--muted); border-radius: var(--radius-lg); padding: .375rem; margin-bottom: 1.5rem;
  border: 1.5px solid var(--border);
}
.auth-tab {
  height: 44px; border-radius: var(--radius-md); cursor: pointer;
  font-weight: 700; font-size: .85rem;
  background: transparent; color: var(--muted-foreground); transition: all .2s;
  touch-action: manipulation;
}
.auth-tab.active {
  background: var(--primary); color: var(--primary-foreground);
  box-shadow: 0 2px 16px var(--primary-glow);
}
.f-label { font-size: .75rem; font-weight: 600; color: var(--muted-foreground); margin-bottom: .375rem; display: block; }
.f-consent { display:flex; align-items:flex-start; gap:.5rem; font-size:.72rem; line-height:1.4; color:var(--muted-foreground); margin:.7rem 0; cursor:pointer; }
.f-consent input[type="checkbox"] { margin-top:.15rem; flex-shrink:0; width:16px; height:16px; accent-color:var(--primary,#000); }
.f-consent-title { display:block; }
.f-consent-links { display:block; margin-top:.2rem; }
.f-consent a { color:inherit; text-decoration:underline; white-space:nowrap; }
.f-input {
  width: 100%; height: 52px; padding: 0 1rem;
  border-radius: var(--radius-lg);
  background: var(--input); border: 1.5px solid var(--border);
  color: var(--foreground); font-size: .95rem; margin-bottom: .75rem; transition: all .2s;
}
.f-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); outline: none; }
.f-pw-wrap { position: relative; }
.f-pw-wrap .f-input { padding-right: 2.75rem; }
.f-pw-toggle {
  position: absolute; right: .5rem; top: 0; height: 52px; width: 2.25rem;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; color: var(--muted-foreground);
  cursor: pointer; padding: 0;
}
.f-pw-toggle:hover { color: var(--foreground); }
.auth-btn {
  width: 100%; height: 56px; border-radius: var(--radius-2xl);
  background: var(--secondary); color: var(--muted-foreground);
  font-weight: 800; font-size: .95rem; cursor: pointer;
  transition: all .25s; border: 1.5px solid var(--border); touch-action: manipulation;
}
.auth-btn:hover { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); box-shadow: 0 4px 24px var(--primary-glow); }
.auth-btn:active { transform: scale(.99); }
.auth-btn:disabled { opacity: .4; pointer-events: none; }

/* ── PAGE ─────────────────────────────────────────────────────── */
.page {
  padding: 1.5rem; max-width: 900px; margin: 0 auto;
  padding-bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px) + 4.5rem);
}
.pg-tag { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-foreground); font-weight: 700; margin-bottom: .2rem; }
.pg-title { font-size: 2.25rem; font-weight: 800; line-height: 1.1; text-transform: capitalize; color: var(--foreground); }
.pg-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.125rem; gap: 1rem; flex-wrap: wrap; }
.date-inp {
  height: 48px; padding: 0 1rem; border-radius: var(--radius-xl);
  background: var(--input); border: 1.5px solid var(--border);
  color: var(--foreground); font-size: .875rem; cursor: pointer; font-weight: 600; transition: all .2s;
}
.date-inp:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); outline: none; }

/* ── LEYENDA ──────────────────────────────────────────────────── */
.legend {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: .5rem; margin-bottom: .875rem;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-xl);
  padding: .75rem 1rem;
}
.leg { display: flex; align-items: center; gap: .45rem; font-size: .82rem; font-weight: 600; color: var(--foreground); }
.leg:nth-child(2) { justify-content: center; }
.leg:nth-child(3) { justify-content: flex-end; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

/* ── SLOTS ────────────────────────────────────────────────────── */
.expand-btn {
  width: 100%; height: 48px; border-radius: var(--radius-xl);
  background: var(--card); border: 1.5px solid var(--border);
  color: var(--muted-foreground); font-weight: 600; font-size: .875rem;
  margin: .4rem 0; transition: all .2s;
  touch-action: manipulation;
}
.expand-btn:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 18px var(--primary-glow); }
.expand-btn:active { transform: scale(.99); }

.slot {
  display: flex; align-items: center; gap: .875rem;
  border-radius: var(--radius-2xl); padding: 1.125rem 1.25rem;
  margin-bottom: .5rem; min-height: 80px; transition: all .22s;
  width: 100%; overflow: hidden;
}

.slot.free {
  background: oklch(0.68 0.18 145 / 0.08);
  border: 1.5px solid oklch(0.68 0.18 145 / 0.25);
}
.slot.free:hover {
  background: oklch(0.68 0.18 145 / 0.13);
  border-color: oklch(0.68 0.18 145 / 0.42);
  box-shadow: 0 4px 20px var(--success-glow);
}
.slot.busy {
  background: oklch(0.62 0.22 25 / 0.08);
  border: 1.5px solid oklch(0.62 0.22 25 / 0.3);
}
.slot.busy:hover {
  background: oklch(0.62 0.22 25 / 0.13);
  border-color: oklch(0.62 0.22 25 / 0.48);
  box-shadow: 0 4px 20px var(--destructive-glow);
}
.slot.paid {
  background: oklch(0.78 0.16 75 / 0.08);
  border: 1.5px solid oklch(0.78 0.16 75 / 0.3);
}
.slot.paid:hover {
  background: oklch(0.78 0.16 75 / 0.13);
  border-color: oklch(0.78 0.16 75 / 0.48);
  box-shadow: 0 4px 20px var(--primary-glow);
}

.slot-time {
  width: 84px; font-size: 1.7rem; font-weight: 900;
  font-variant-numeric: tabular-nums; flex-shrink: 0; line-height: 1;
}
.slot.free .slot-time { color: var(--success); }
.slot.busy .slot-time { color: var(--destructive); }
.slot.paid .slot-time { color: var(--primary); }

.slot-body { flex: 1; min-width: 0; }
.slot-name { font-size: 1.2rem; font-weight: 800; line-height: 1.2; }
.slot.busy .slot-name { color: var(--destructive); }
.slot.paid .slot-name { color: var(--primary); }
.slot-free-txt { font-size: .9rem; color: var(--success); font-weight: 600; }
.slot.busy .slot-free-txt { color: var(--destructive); }
.slot.paid .slot-free-txt { color: var(--primary); }
.slot-paid-info { font-size: .85rem; margin-top: .2rem; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; }
.slot.busy .slot-paid-info { color: var(--destructive); }
.slot.busy .slot-barbero { color: var(--destructive); opacity: .8; }
.slot.paid .slot-barbero { color: var(--primary); opacity: .8; }

.slot-actions {
  display: flex;
  align-items: center;
  gap: .375rem;
  flex-shrink: 0;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.slot-actions svg, .btn-plus svg, .btn-del-slot svg, .check-icon svg {
  width: 20px !important;
  height: 20px !important;
  flex-shrink: 0;
}

.btn-cobrar {
  height: 48px; padding: 0 1.25rem; border-radius: var(--radius-xl);
  background: var(--destructive); color: var(--destructive-foreground);
  font-weight: 900; font-size: .88rem; letter-spacing: .04em;
  transition: all .2s; border: 1.5px solid oklch(1 0 0 / 0.14);
  box-shadow: 0 2px 12px var(--destructive-glow);
  touch-action: manipulation;
}
.btn-cobrar:hover { box-shadow: 0 4px 20px var(--destructive-glow); transform: translateY(-1px); }
.btn-cobrar:active { transform: scale(.98); }

.btn-ver {
  height: 48px; padding: 0 1.25rem; border-radius: var(--radius-xl);
  background: var(--primary); color: var(--primary-foreground);
  font-weight: 900; font-size: .88rem; letter-spacing: .04em;
  transition: all .2s; border: 1.5px solid oklch(1 0 0 / 0.14);
  box-shadow: 0 2px 12px var(--primary-glow);
  touch-action: manipulation;
}
.btn-ver:hover { box-shadow: 0 4px 20px var(--primary-glow); transform: translateY(-1px); }
.btn-ver:active { transform: scale(.98); }

.btn-del-slot {
  width: 44px; height: 44px; border-radius: var(--radius-lg);
  background: oklch(0 0 0 / 0.18); color: oklch(1 0 0 / 0.82); cursor: pointer;
  font-size: .95rem; display: grid; place-items: center;
  transition: all .2s; border: 1.5px solid oklch(1 0 0 / 0.18);
  touch-action: manipulation;
}
.btn-del-slot:hover { background: oklch(0 0 0 / 0.36); }
.btn-del-slot:active { transform: scale(.97); }

.btn-plus {
  width: 44px; height: 44px; border-radius: var(--radius-lg);
  background: oklch(0.68 0.18 145 / 0.12); color: var(--success);
  font-size: 1.3rem; display: grid; place-items: center;
  transition: all .2s; border: 1.5px solid oklch(0.68 0.18 145 / 0.28);
  touch-action: manipulation;
}
.slot.paid .btn-plus, .slot.paid .btn-del-slot {
  background: oklch(0.78 0.16 75 / 0.14); color: var(--primary);
  border-color: oklch(0.78 0.16 75 / 0.4);
}
.slot.busy .btn-plus, .slot.busy .btn-del-slot {
  background: oklch(0.62 0.22 25 / 0.14); color: var(--destructive);
  border-color: oklch(0.62 0.22 25 / 0.4);
}
.slot.paid .btn-plus:hover, .slot.paid .btn-del-slot:hover { background: oklch(0.78 0.16 75 / 0.22); }
.slot.busy .btn-plus:hover, .slot.busy .btn-del-slot:hover { background: oklch(0.62 0.22 25 / 0.22); }
.btn-plus:hover { background: var(--success); color: var(--success-foreground); box-shadow: 0 0 18px var(--success-glow); }
.btn-plus:active { transform: scale(.97); }

.check-icon {
  width: 40px; height: 40px; border-radius: 50%;
  background: oklch(0.78 0.16 75 / 0.14); border: 2px solid oklch(0.78 0.16 75 / 0.4);
  display: grid; place-items: center; color: var(--primary); font-size: .95rem;
}

/* ── MODAL ────────────────────────────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: oklch(0 0 0 / 0.62);
  display: grid; place-items: center; z-index: 100; padding: 1rem;
}
.modal {
  width: 100%; max-width: 480px; background: var(--card);
  border-radius: var(--radius-3xl);
  border: 1.5px solid var(--border); position: relative;
  box-shadow: 0 25px 60px oklch(0 0 0 / 0.65), 0 0 0 1px oklch(1 0 0 / 0.04);
  display: flex; flex-direction: column;
  max-height: 88vh; max-height: 88dvh;
  overflow: hidden;
}
.modal-body {
  padding: 1.875rem 1.875rem 1.5rem;
  overflow-y: auto; overscroll-behavior: contain;
}
.modal-actions {
  position: sticky; bottom: 0;
  padding: 1rem 1.875rem calc(1rem + env(safe-area-inset-bottom, 0px));
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: .5rem;
  flex-shrink: 0;
}
.modal-close {
  position: absolute; top: 1rem; right: 1rem; z-index: 2;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: var(--muted-foreground);
  font-size: .9rem; display: grid; place-items: center; transition: all .2s;
  touch-action: manipulation;
}
.modal-close:hover { color: var(--foreground); background: var(--border); }
.m-tag { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted-foreground); margin-bottom: .2rem; }
.m-title { font-size: 2rem; font-weight: 800; margin-bottom: .2rem; color: var(--foreground); }
.m-sub { font-size: .85rem; color: var(--muted-foreground); margin-bottom: 1.375rem; }
.m-label { font-size: .78rem; font-weight: 600; color: var(--muted-foreground); margin-bottom: .4rem; display: block; }
.m-input {
  width: 100%; height: 56px; padding: 0 1rem; border-radius: var(--radius-xl);
  background: var(--input); border: 1.5px solid var(--border);
  color: var(--foreground); font-size: 1.1rem; margin-bottom: 1.125rem; transition: all .2s;
}
.m-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); outline: none; }
.m-btn {
  width: 100%; height: 56px; border-radius: var(--radius-2xl);
  background: var(--primary); color: var(--primary-foreground);
  font-weight: 800; font-size: 1.05rem;
  transition: all .2s; box-shadow: 0 4px 20px var(--primary-glow);
  touch-action: manipulation;
}
.m-btn:hover { box-shadow: 0 6px 28px var(--primary-glow); opacity: .92; }
.m-btn:active { transform: scale(.99); }

/* ── COBRO ────────────────────────────────────────────────────── */

/* ── TRADUCTOR DE ERRORES DE SUPABASE AUTH ───────────────────── */
function traducirError(msg){
  if(!msg)return'Ha ocurrido un error. Inténtalo de nuevo.';
  const m=msg.toLowerCase();
  if(m.includes('invalid login credentials'))return'Correo o contraseña incorrectos';
  if(m.includes('user already registered')||m.includes('already registered'))return'Ese correo ya tiene una cuenta creada';
  if(m.includes('auth session missing'))return'La sesión aún se está preparando. Espera un segundo e inténtalo de nuevo';
  if(m.includes('password should be at least')||m.includes('password should contain'))return'La contraseña debe tener al menos 6 caracteres';
  if(m.includes('new password should be different'))return'La nueva contraseña debe ser distinta a la anterior';
  if(m.includes('unable to validate email')||m.includes('invalid email'))return'El formato del correo no es válido';
  if(m.includes('error sending confirmation')||m.includes('error sending recovery')||m.includes('error sending')&&m.includes('email'))return'No pudimos enviarte el correo de confirmación en este momento (fallo técnico temporal). Escríbenos por WhatsApp al +34 643 668 284 y activamos tu cuenta manualmente.';
  if(m.includes('email rate limit') || m.includes('rate limit'))return'Se han pedido demasiados correos seguidos. Espera unos minutos e inténtalo de nuevo';
  if(m.includes('for security purposes')||m.includes('only request this once every'))return'Por seguridad, espera unos segundos antes de volver a intentarlo';
  if(m.includes('email not confirmed'))return'Confirma tu correo antes de iniciar sesión (revisa tu bandeja de entrada)';
  if(m.includes('user not found'))return'No existe ninguna cuenta con ese correo';
  if(m.includes('network')||m.includes('fetch'))return'Error de conexión. Revisa tu internet e inténtalo de nuevo';
  if(m.includes('token has expired')||m.includes('invalid or expired'))return'El enlace ha caducado. Pide uno nuevo desde "¿Olvidaste tu contraseña?"';
  return msg;
}

/* Detectamos el enlace de recuperación LEYENDO LA URL directamente
   (Supabase añade type=recovery al hash o a la query del enlace del
   correo). Esto es inmediato y no depende del orden en que lleguen
   los eventos de auth — evita que una sesión ya guardada en el
   navegador "gane la carrera" y nos saque de esta pantalla. */
const _hp=new URLSearchParams(window.location.hash.replace(/^#/,''));
const _sp=new URLSearchParams(window.location.search);
let recoveryMode=_hp.get('type')==='recovery'||_sp.get('type')==='recovery';
let initialized=false;

function limpiarUrlRecovery(){
  try{
    const limpio=window.location.pathname+window.location.search.replace(/[?&]?type=recovery/,'');
    history.replaceState(null,'',limpio);
  }catch(e){}
}

function init(){
  if(recoveryMode){
    /* NO tocamos la URL todavía: el token de recuperación sigue en el
       hash y Supabase aún no lo ha leído. Si la limpiamos ahora,
       borramos el token antes de que se pueda usar. Solo mostramos
       la pantalla; la limpieza de URL se hace más adelante, una vez
       la sesión ya quedó confirmada (ver PASSWORD_RECOVERY abajo y
       esperarSesion). */
    authScreen('newpass');
  }
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='PASSWORD_RECOVERY'){
      recoveryMode=true;
      user=session.user;sess={email:user.email};
      authScreen('newpass');
      initialized=true;
      limpiarUrlRecovery();
      return;
    }
    if(event==='SIGNED_OUT'){
      recoveryMode=false;sess=null;user=null;profile=null;draw();
      return;
    }
    if(recoveryMode){
      /* Mientras estemos en modo recuperación, ignoramos cualquier
         otro evento (sesión antigua guardada, refresh de token, etc.)
         para no sacar al usuario de la pantalla de nueva contraseña. */
      if(session&&(!user||user.id!==session.user.id)){user=session.user;sess={email:user.email};authScreen('newpass');limpiarUrlRecovery();}
      return;
    }
    if(event==='INITIAL_SESSION'&&!initialized){
      initialized=true;
      if(session){
        user=session.user;sess={email:user.email};
        await draw();
      }else{
        draw();
      }
    }
  });
  /* Salvaguarda: si por algún motivo INITIAL_SESSION no llega en 2s
     (versión antigua del SDK), pintamos igualmente con getSession(). */
  setTimeout(async()=>{
    if(initialized||recoveryMode)return;
    initialized=true;
    const{data:{session}}=await sb.auth.getSession();
    if(recoveryMode)return;
    if(session){user=session.user;sess={email:user.email};await draw();}
    else draw();
  },2000);
}

async function draw(){
  if(!sess){authScreen('login');return;}

  /* Si el usuario acaba de volver de pagar en Stripe, el webhook puede
     tardar uno o dos segundos en activar el perfil. En vez de mostrar
     el bloqueo de inmediato, reintentamos un par de veces. */
  const _sp=new URLSearchParams(window.location.search);
  const vieneDePago=_sp.get('checkout')==='success';
  if(vieneDePago){
    try{history.replaceState(null,'',window.location.pathname);}catch(e){}
  }

  let intentos=vieneDePago?6:1;
  let data,error;
  for(let i=0;i<intentos;i++){
    ({data,error}=await sb.from('profiles').select('plan_status,trial_ends_at,session_token,pais').eq('id',user.id).single());
    if(data&&data.plan_status==='active')break;
    if(i<intentos-1)await new Promise(r=>setTimeout(r,1000));
  }

  if(error||!data){
    /* Si por algún motivo no hay fila de perfil, la crea con trial de 30 días.
       El país y teléfono se leen de los metadatos guardados en el registro
       (sobreviven aunque hayan pasado días desde que se creó la cuenta y
       se confirme el correo desde otra pestaña/sesión). */
    const trialEnd=new Date(Date.now()+30*24*60*60*1000).toISOString();
    const miToken=crypto.randomUUID();
    const metaPais=user.user_metadata?.pais||'ES';
    const metaTelefono=user.user_metadata?.telefono||null;
    const metaIva=metaPais==='CO'?19:21;
    await sb.from('profiles').insert({id:user.id,session_token:miToken,telefono:metaTelefono,pais:metaPais,iva_porcentaje:metaIva});
    guardarSesionLocal(user.id,miToken);
    /* trial_ends_at y plan_status ya no se envían: la base de datos los fija
       sola de forma segura (30 días, 'trial'). Este valor local es solo para
       mostrar algo inmediato en pantalla mientras se recarga el perfil real. */
    profile={plan_status:'trial',trial_ends_at:trialEnd,session_token:miToken,pais:metaPais};
  }else{
    profile=data;
  }

  /* Un solo dispositivo a la vez por cuenta: si el token guardado en el
     perfil no coincide con el de este dispositivo, es que alguien más
     inició sesión con las mismas credenciales en otro lugar. */
  const miTokenLocal=leerSesionLocal(user.id);
  if(profile.session_token&&miTokenLocal&&profile.session_token!==miTokenLocal){
    await sb.auth.signOut();
    sess=null;user=null;profile=null;
    toast('Se ha iniciado sesión en otro dispositivo. Por seguridad, cerramos esta sesión.','error');
    setTimeout(()=>authScreen('login'),300);
    return;
  }
  if(profile.session_token&&!miTokenLocal){
    /* Primer arranque de esta protección en un dispositivo ya abierto
       antes del cambio: lo adoptamos sin cerrar la sesión de golpe. */
    guardarSesionLocal(user.id,profile.session_token);
  }
  if(!sessionCheckInterval){
    sessionCheckInterval=setInterval(verificarSesionUnica,45000);
  }

  const trialVencido=profile.plan_status==='trial'&&profile.trial_ends_at&&new Date(profile.trial_ends_at)<new Date();
  const bloqueado=profile.plan_status==='cancelled'||profile.plan_status==='past_due'||trialVencido;

  if(bloqueado){blockScreen(trialVencido);return;}
  if(vieneDePago)toast('¡Pago confirmado! Bienvenido de nuevo ✂️','success');
  appScreen();
}

    const resp=await fetch('/api/create-portal-session',{

    const result=await resp.json();
    if(!resp.ok||!result.url){
      toast(result.error||'No se pudo abrir el portal de gestión','error');
      if(btn)btn.style.opacity='1';
      return;
    }
    window.location.href=result.url;
  }catch(e){
    toast('Error de conexión. Inténtalo de nuevo.','error');
    if(btn)btn.style.opacity='1';
  }
}

async function irAPagar(){
  const btn=document.getElementById('pagar-btn');
  if(btn){btn.disabled=true;btn.textContent='Un momento…';}
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session){toast('Vuelve a iniciar sesión para continuar','error');if(btn){btn.disabled=false;btn.textContent='Suscribirme ahora';}return;}

    const resp=await fetch('/api/create-checkout-session',{
      method:'POST',
      headers:{'Authorization':'Bearer '+session.access_token}
    });
    const result=await resp.json();
    if(!resp.ok||!result.url){
      toast(result.error||'No se pudo iniciar el pago','error');
      if(btn){btn.disabled=false;btn.textContent='Suscribirme ahora';}
      return;
    }
    window.location.href=result.url;
  }catch(e){
    toast('Error de conexión al iniciar el pago','error');
    if(btn){btn.disabled=false;btn.textContent='Suscribirme ahora';}
  }
}

/* ── LÓGICA DE AUTH (Supabase) ────────────────────────────────── */
let sessionCheckInterval=null;
function claveSesionLocal(uid){return 'bt_session_'+uid;}
function guardarSesionLocal(uid,token){try{localStorage.setItem(claveSesionLocal(uid),token);}catch(e){}}
function leerSesionLocal(uid){try{return localStorage.getItem(claveSesionLocal(uid));}catch(e){return null;}}

/* Revisa periódicamente si esta cuenta se inició en otro dispositivo
   (comparando el token de sesión guardado en el perfil). Si no
   coincide, cierra esta sesión automáticamente. */
async function verificarSesionUnica(){
  if(!user)return;
  const{data}=await sb.from('profiles').select('session_token').eq('id',user.id).single();
  const miTokenLocal=leerSesionLocal(user.id);
  if(data&&data.session_token&&miTokenLocal&&data.session_token!==miTokenLocal){
    if(sessionCheckInterval){clearInterval(sessionCheckInterval);sessionCheckInterval=null;}
    await sb.auth.signOut();
    sess=null;user=null;profile=null;
    toast('Se ha iniciado sesión en otro dispositivo. Por seguridad, cerramos esta sesión.','error');
    authScreen('login');
  }
}

async function doLogin(){
  const email=(document.getElementById('au')?.value||'').trim();
  const pass=document.getElementById('ap')?.value||'';
  let ok=true;
  if(!email){document.getElementById('err-u').textContent='Introduce tu correo';ok=false;}
  else document.getElementById('err-u').textContent='';
  if(!pass){document.getElementById('err-p').textContent='Introduce tu contraseña';ok=false;}
  else document.getElementById('err-p').textContent='';
  if(!ok)return;

  const btn=document.getElementById('ab');if(btn)btn.disabled=true;
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(btn)btn.disabled=false;
  if(error){document.getElementById('err-p').textContent='Correo o contraseña incorrectos';return;}

  user=data.user;sess={email:user.email};
  const miToken=crypto.randomUUID();
  await sb.from('profiles').update({session_token:miToken}).eq('id',user.id);
  guardarSesionLocal(user.id,miToken);
  toast('¡Bienvenido! ✂️','success');
  setTimeout(()=>draw(),300);
}

function normalizarTelefono(raw){
  let t=(raw||'').trim().replace(/[\s\-()]/g,'');
  if(!t)return null;
  if(!t.startsWith('+')){
    // Sin prefijo internacional: asumimos España
    t=t.replace(/^0+/,'');
    t='+34'+t;
  }
  const digitos=t.replace(/^\+/,'');
  if(digitos.length<9||!/^\d+$/.test(digitos))return null;
  return t;
}

async function doRegister(){
  const email=(document.getElementById('ru')?.value||'').trim();
  const telRaw=document.getElementById('rt')?.value||'';
  const pass=document.getElementById('rp')?.value||'';
  let ok=true;
  if(!email){document.getElementById('err-ru').textContent='El correo es obligatorio';ok=false;}
  else document.getElementById('err-ru').textContent='';
  const telefono=normalizarTelefono(telRaw);
  if(!telefono){document.getElementById('err-rt').textContent='Introduce un teléfono de WhatsApp válido';ok=false;}
  else document.getElementById('err-rt').textContent='';
  if(pass.length<6){document.getElementById('err-rp').textContent='Mínimo 6 caracteres';ok=false;}
  else document.getElementById('err-rp').textContent='';
  const aceptaTerminos=document.getElementById('rc')?.checked;
  if(!aceptaTerminos){document.getElementById('err-rc').textContent='Debes aceptar los términos para continuar';ok=false;}
  else document.getElementById('err-rc').textContent='';
  if(!ok)return;

  const btn=document.getElementById('rb');if(btn)btn.disabled=true;
  const pais=document.getElementById('rpais')?.value||'ES';
  const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{pais,telefono}}});
  if(error){if(btn)btn.disabled=false;document.getElementById('err-ru').textContent=traducirError(error.message);return;}

  /* Supabase, por seguridad, no avisa si el correo ya tiene cuenta: en
     lugar de dar error, silenciosamente autentica al usuario existente.
     Lo detectamos con identities.length===0 (indicador estándar de que
     el usuario ya existía) y lo bloqueamos aquí para que no entre a una
     cuenta ajena/antigua sin darse cuenta. */
  const yaExistia=data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0;
  if(yaExistia){
    await sb.auth.signOut();
    if(btn)btn.disabled=false;
    document.getElementById('err-ru').textContent='Ya existe una cuenta con este correo. Inicia sesión en su lugar.';
    return;
  }

  if(btn)btn.disabled=false;
  if(!data.session){pantallaCodigoConfirmacion(email,telefono,pais);return;}

  const trialEnd=new Date(Date.now()+30*24*60*60*1000).toISOString();
  const miToken=crypto.randomUUID();
  const ivaPorDefecto=pais==='CO'?19:21;
  const{error:errPerfil}=await sb.from('profiles').insert({id:data.user.id,session_token:miToken,telefono,pais,iva_porcentaje:ivaPorDefecto});
  if(errPerfil){
    await sb.auth.signOut();
    document.getElementById('err-ru').textContent='No se pudo crear el perfil. Intenta de nuevo o inicia sesión si ya tienes cuenta.';
    return;
  }
  guardarSesionLocal(data.user.id,miToken);

  user=data.user;sess={email:user.email};
  toast('¡Cuenta creada! 30 días de prueba activados ✂️','success');
  setTimeout(()=>draw(),400);
}

async function doRecover(){
  const email=(document.getElementById('vu')?.value||'').trim();
  if(!email){document.getElementById('err-vu').textContent='Introduce tu correo';return;}
  document.getElementById('err-vu').textContent='';

  const{error}=await sb.auth.resetPasswordForEmail(email);
  const resultEl=document.getElementById('recover-result');
  if(error){document.getElementById('err-vu').textContent=traducirError(error.message);return;}
  if(resultEl)resultEl.innerHTML=`<div class="recover-result"><span class="r-label">Listo</span><span style="font-size:.85rem">Revisa tu correo para restablecer tu contraseña.</span></div>`;
}

async function esperarSesion(maxIntentos=10){
  for(let i=0;i<maxIntentos;i++){
    const{data:{session}}=await sb.auth.getSession();
    if(session)return session;
    await new Promise(r=>setTimeout(r,300));
  }
  return null;
}

async function doNewPassword(){
  const p1=document.getElementById('np1')?.value||'';
  const p2=document.getElementById('np2')?.value||'';
  let ok=true;
  if(p1.length<6){document.getElementById('err-np1').textContent='Mínimo 6 caracteres';ok=false;}
  else document.getElementById('err-np1').textContent='';
  if(p1!==p2){document.getElementById('err-np2').textContent='Las contraseñas no coinciden';ok=false;}
  else document.getElementById('err-np2').textContent='';
  if(!ok)return;

  const btn=document.getElementById('npb');if(btn){btn.disabled=true;btn.textContent='Un momento…';}
  document.getElementById('err-np2').textContent='';

  /* El enlace del correo tarda un instante en establecer la sesión
     de recuperación por detrás. Esperamos activamente a que esté
     lista antes de intentar guardar, en vez de fallar de inmediato. */
  const session=await esperarSesion();
  if(!session){
    if(btn){btn.disabled=false;btn.textContent='Guardar contraseña';}
    document.getElementById('err-np2').textContent='El enlace ha caducado o ya se usó. Vuelve a pedir "¿Olvidaste tu contraseña?" e inténtalo de nuevo.';
    return;
  }

  const{error}=await sb.auth.updateUser({password:p1});
  if(btn){btn.disabled=false;btn.textContent='Guardar contraseña';}
  if(error){document.getElementById('err-np2').textContent=traducirError(error.message);return;}

  recoveryMode=false;
  toast('Contraseña actualizada ✂️','success');
  setTimeout(()=>draw(),400);
}

function parseImporte(raw){
  raw=(raw||'').toString().trim();
  if(!raw)return 0;
  const pais=(profile&&profile.pais)||'ES';
  if(pais==='CO'){
    /* En Colombia el punto es separador de miles, no decimal */
    return parseFloat(raw.replace(/\./g,'').replace(',','.'))||0;
  }
  return parseFloat(raw.replace(',','.'))||0;
}
function formatearSalidaImporte(n){
  const pais=(profile&&profile.pais)||'ES';
  if(pais==='CO')return Math.round(n).toLocaleString('es-CO');
  return n.toFixed(2);
}
function formatearInputCO(el){
  const pais=(profile&&profile.pais)||'ES';
  if(pais!=='CO'||!el)return;
  const digits=el.value.replace(/[^\d]/g,'');
  el.value=digits?Number(digits).toLocaleString('es-CO'):'';
}
function onImporteInput(id,origen){
  formatearInputCO(document.getElementById(id));
  recalcReparto(origen);
}
function recalcReparto(origen){
  const total=parseImporte(document.getElementById('pa')?.value);
  const vbEl=document.getElementById('pvb'),clEl=document.getElementById('pcl');
  if(!vbEl||!clEl)return;
  if(origen==='vb'){
    const vb=parseImporte(vbEl.value);
    clEl.value=formatearSalidaImporte(Math.max(0,total-vb));
  }else if(origen==='cl'){
    const cl=parseImporte(clEl.value);
    vbEl.value=formatearSalidaImporte(Math.max(0,total-cl));
  }else{
    const vb=parseImporte(vbEl.value);
    clEl.value=formatearSalidaImporte(Math.max(0,total-vb));
  }
}

function selM(m){
  meth=m;

    const b=document.getElementById('pm-'+x);

  });
}

function getRange(){
  const n=new Date();let s,e;
  if(cper==='dia'){s=dt;e=dt;}
  else if(cper==='hoy'){s=today();e=today();}
  else if(cper==='semana'){const d=new Date(n);d.setDate(d.getDate()-d.getDay()+1);s=d.toISOString().slice(0,10);const d2=new Date(d);d2.setDate(d2.getDate()+6);e=d2.toISOString().slice(0,10);}
  else if(cper==='mes'){s=new Date(n.getFullYear(),n.getMonth(),1).toISOString().slice(0,10);e=new Date(n.getFullYear(),n.getMonth()+1,0).toISOString().slice(0,10);}
  else{const q=Math.floor(n.getMonth()/3);s=new Date(n.getFullYear(),q*3,1).toISOString().slice(0,10);e=new Date(n.getFullYear(),q*3+3,0).toISOString().slice(0,10);}
  return{s,e};
}

  const{s,e}=getRange();
  const[{data:a},{data:x}]=await Promise.all([

    sb.from('expenses').select('*').eq('user_id',user.id).gte('expense_date',s).lte('expense_date',e)
  ]);
  const ap=a||[],ex=x||[];
  window._liqAp=ap;
  let of=0,int=0,ingresoNegocio=0,dineroBarberos=0;
  ap.forEach(a=>{
    const v=Number(a.price)||0;
    if(a.payment_type==='oficial')of+=v;else int+=v;
    ingresoNegocio+=Number(a.comision_local)||0;
    dineroBarberos+=Number(a.valor_barbero)||0;
  });
  const tot=of+int,gas=ex.reduce((s,x)=>s+Number(x.amount||0),0);
  const pers=['dia','hoy','semana','mes','trimestre'];
  const perL={dia:'📅 Día',hoy:'Hoy',semana:'Semana',mes:'Mes',trimestre:'Trimestre'};
  const perBtns=ctab==='cierre'?'':pers.map(p=>`<button class="period-pill ${cper===p?'on':''}" onclick="setCper('${p}')">${perL[p]}</button>`).join('');

async function calcularCierreLive(fecha){
  const[{data:a},{data:x}]=await Promise.all([
    sb.from('appointments').select('*').eq('status','completed').eq('user_id',user.id).eq('appointment_date',fecha),
    sb.from('expenses').select('*').eq('user_id',user.id).eq('expense_date',fecha)
  ]);
  const ap=a||[],ex=x||[];
  let of=0,int=0,ingresoNegocio=0,dineroBarberos=0;
  ap.forEach(a=>{
    const v=Number(a.price)||0;
    if(a.payment_type==='oficial')of+=v;else int+=v;
    ingresoNegocio+=Number(a.comision_local)||0;
    dineroBarberos+=Number(a.valor_barbero)||0;
  });
  const gastosTotal=ex.reduce((s,g)=>s+Number(g.amount||0),0);
  return{
    efectivo:int,tarjeta_transferencia:of,total:of+int,
    ingreso_negocio:ingresoNegocio,dinero_barberos:dineroBarberos,
    gastos_total:gastosTotal,ganancia_neta:ingresoNegocio-gastosTotal,
    gastos_detalle:ex.map(g=>({category:g.category,amount:Number(g.amount),note:g.note||''})),
    citas_count:ap.length,gastos_count:ex.length
  };
}

async function guardarCierre(fecha){
  /* Comprobación extra en el cliente: si ya existe un cierre para este día
     y NO es hoy, ni siquiera lo intentamos (la base de datos también lo
     bloquearía, pero así evitamos una llamada innecesaria y damos un mensaje
     claro). Si es hoy, sí se puede corregir hasta la medianoche. */
  if(fecha!==today()){
    const{data:yaExiste}=await sb.from('cierres_caja').select('id').eq('user_id',user.id).eq('fecha',fecha).maybeSingle();
    if(yaExiste){
      toast('Este día ya está cerrado y congelado. No se puede modificar.','error');
      return;
    }
  }
  const v=await calcularCierreLive(fecha);
  const{error}=await sb.from('cierres_caja').upsert({
    user_id:user.id,fecha,
    efectivo:v.efectivo,tarjeta_transferencia:v.tarjeta_transferencia,total:v.total,
    ingreso_negocio:v.ingreso_negocio,dinero_barberos:v.dinero_barberos,
    gastos_total:v.gastos_total,ganancia_neta:v.ganancia_neta,gastos_detalle:v.gastos_detalle
  },{onConflict:'user_id,fecha'});
  if(error)return toast(traducirError(error.message),'error');
  toast('Cierre guardado ✓','success');loadPg();
}

async function exportCSV(){
  const desde=document.getElementById('exp-desde')?.value;
  const hasta=document.getElementById('exp-hasta')?.value;
  let s,e;
  if(desde&&hasta){
    if(desde>hasta){toast('La fecha "Desde" no puede ser posterior a "Hasta"','error');return;}
    s=desde;e=hasta;
  }else{
    ({s,e}=getRange());
  }
  const[{data:a},{data:x}]=await Promise.all([
    sb.from('appointments').select('*').eq('status','completed').eq('user_id',user.id).gte('appointment_date',s).lte('appointment_date',e),
    sb.from('expenses').select('*').eq('user_id',user.id).gte('expense_date',s).lte('expense_date',e)
  ]);
  const digital=(a||[]).filter(r=>r.payment_method==='tarjeta'||r.payment_method==='transferencia');
  const ex=x||[];
  let totDig=0;digital.forEach(r=>{totDig+=Number(r.price)||0;});
  const gas=ex.reduce((s,r)=>s+Number(r.amount||0),0);
  const rows=[['Fecha','Concepto','Método','Tipo','Importe']];
  digital.forEach(r=>rows.push([r.appointment_date,'Servicio de barbería',r.payment_method||'',r.payment_type||'',Number(r.price||0).toFixed(2)]));
  ex.forEach(r=>rows.push([r.expense_date,`Gasto: ${r.category}${r.note?' - '+r.note:''}`,'-','gasto',(-Number(r.amount)).toFixed(2)]));
  rows.push(['','','','','']);
  rows.push(['','TOTAL INGRESOS DIGITALES','','',totDig.toFixed(2)]);
  rows.push(['','TOTAL GASTOS','',' ',(-gas).toFixed(2)]);
  rows.push(['','NETO DECLARABLE','',' ',(totDig-gas).toFixed(2)]);
  const csv=rows.map(r=>r.join(';')).join('\n');
  const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const lnk=document.createElement('a');lnk.href=url;lnk.download=`ingresos_gastos_${s}_a_${e}.csv`;lnk.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado ✓','success');
}

      <div class="scard">

        <div class="sc-val">${(mins/60).toFixed(1)}<span style="font-size:1.25rem;font-weight:600"> h</span></div>
        <div style="font-size:.78rem;color:var(--muted-foreground);margin-top:.25rem">Anterior: ${(prev.reduce((s,x)=>s+(x.duration_minutes||30),0)/60).toFixed(1)} h</div>
      </div>
      <div class="scard">
        <div class="sc-lbl">Día más Rentable</div>
        <div class="sc-day">${best?best[0]:'—'}</div>
        <div class="sc-amt">${best?eur(best[1]):''}</div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Clientes por día de la semana</div>
      <div class="chart-wrap"><canvas id="cc"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Ingresos por día de la semana</div>
      <div class="chart-wrap"><canvas id="ci"></canvas></div>
    </div>
    <div class="bb-section">
      <button class="bb-btn" id="bb-btn">
        <span class="bb-btn-icon">🧠</span>
        Consultar con BarberBrain
        <span class="bb-badge">Local</span>
      </button>
      <div id="bb-result-container"></div>
    </div>
  </div>`;

  const gridColor='oklch(0.30 0.014 270)',tickColor='oklch(0.70 0.02 270)';
  const cfg={
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},tooltip:{backgroundColor:'oklch(0.21 0.014 270)',titleColor:'oklch(0.97 0.005 270)',bodyColor:'oklch(0.70 0.02 270)',borderColor:'oklch(0.30 0.014 270)',borderWidth:1}},
    scales:{
      x:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:12,weight:'600'}}},
      y:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:12}}}
    }
  };
  charts.c=new Chart(document.getElementById('cc'),{type:'bar',data:{labels:DAYS,datasets:[{data:cd,backgroundColor:'oklch(0.78 0.16 75)',borderRadius:8,borderSkipped:false}]},options:cfg});
  charts.i=new Chart(document.getElementById('ci'),{type:'bar',data:{labels:DAYS,datasets:[{data:id2,backgroundColor:'oklch(0.68 0.18 145)',borderRadius:8,borderSkipped:false}]},options:cfg});

  const bbBtn = document.getElementById('bb-btn');
  if (bbBtn) bbBtn.addEventListener('click', () => lanzarBarberBrain(c1, c0, gr, best, cd, id2));
}

/* ══════════════════════════════════════════════════════════════
   BARBERBRAIN INSIGHTS — motor de reglas local (sin IA, sin costo)
   ══════════════════════════════════════════════════════════════ */
function generarAnalisisLocal(c1, c0, gr, best, cd, id2) {
  const totIngresos = id2.reduce((s, v) => s + v, 0);
  const totClientes = cd.reduce((s, v) => s + v, 0);
  const ticketMedio = totClientes > 0 ? totIngresos / totClientes : 0;

  const diasConDatos = DAYS.map((d, i) => ({ dia: d, ing: id2[i], cli: cd[i] })).filter(x => x.cli > 0);
  const peor = diasConDatos.length > 0 ? diasConDatos.reduce((a, b) => a.ing < b.ing ? a : b) : null;

  const diasActivos = diasConDatos.length;
  const concentracion = best && totIngresos > 0 ? (best[1] / totIngresos) * 100 : 0;

  let tendencia;
  if (c0 === 0 && c1 > 0) {
    tendencia = `Este es tu primer mes con datos comparables: atendiste ${c1} cliente${c1===1?'':'s'} y generaste ${eur(totIngresos)} en ingresos. A partir de ahora podrás ver la evolución mes a mes.`;
  } else if (c1 === 0) {
    tendencia = `Este mes no se han registrado citas completadas todavía. En cuanto cierres las primeras citas, aquí verás el análisis de tendencia.`;
  } else if (gr > 15) {
    tendencia = `Fuerte crecimiento: pasaste de ${c0} a ${c1} clientes (+${gr}%), con ${eur(totIngresos)} de ingresos este mes. La tendencia es claramente positiva.`;
  } else if (gr > 0) {
    tendencia = `Crecimiento moderado: subiste de ${c0} a ${c1} clientes (+${gr}%). Ingresos del mes: ${eur(totIngresos)}, ticket medio de ${eur(ticketMedio)}.`;
  } else if (gr === 0) {
    tendencia = `Mes estable: te mantienes en ${c1} clientes, igual que el mes anterior, con ${eur(totIngresos)} de ingresos totales.`;
  } else if (gr > -15) {
    tendencia = `Ligero descenso: de ${c0} a ${c1} clientes (${gr}%). Ingresos del mes: ${eur(totIngresos)}. Vale la pena vigilar si continúa el próximo mes.`;
  } else {
    tendencia = `Descenso notable: caíste de ${c0} a ${c1} clientes (${gr}%). Conviene revisar qué ha cambiado (agenda, horarios, promociones) antes de que se convierta en tendencia.`;
  }

  let puntoFuerte;
  if (!best) {
    puntoFuerte = 'Todavía no hay suficientes datos para identificar tu día más fuerte.';
  } else if (diasActivos >= 5) {
    puntoFuerte = `${best[0]} es tu día estrella, con ${eur(best[1])} de ingresos (${concentracion.toFixed(0)}% del total del mes). Además trabajas de forma constante ${diasActivos} días distintos a la semana.`;
  } else {
    puntoFuerte = `${best[0]} es tu día más rentable, con ${eur(best[1])} de ingresos, lo que representa el ${concentracion.toFixed(0)}% de tus ingresos del mes.`;
  }

  let oportunidad;
  if (peor && best && peor.dia !== best[0]) {
    oportunidad = `${peor.dia} es tu día más flojo (${peor.cli} cliente${peor.cli===1?'':'s'}, ${eur(peor.ing)}). Prueba una promoción puntual o recordatorios a clientes habituales ese día para nivelar la agenda.`;
  } else if (ticketMedio > 0 && ticketMedio < 15) {
    oportunidad = `Tu ticket medio es de ${eur(ticketMedio)}. Ofrecer un servicio adicional (barba, tratamiento capilar) podría subir el ticket medio sin necesitar más clientes.`;
  } else if (diasActivos > 0 && diasActivos < 4) {
    oportunidad = `Solo tienes actividad registrada en ${diasActivos} día${diasActivos===1?'':'s'} de la semana. Abrir o promocionar un día adicional podría aumentar tus ingresos totales.`;
  } else {
    oportunidad = `Tu actividad está bien repartida durante la semana. Mantén la comunicación con tus clientes habituales para consolidar esta regularidad.`;
  }

  let alerta = null;
  if (gr <= -15) {
    alerta = `La caída de clientes de este mes (${gr}%) es significativa. Si se repite el próximo mes, conviene actuar cuanto antes.`;
  } else if (concentracion >= 45 && diasActivos > 1) {
    alerta = `Casi la mitad de tus ingresos dependen de un solo día (${best[0]}). Si ese día falla, el impacto en la facturación sería grande.`;
  } else if (totClientes > 0 && ticketMedio > 0 && ticketMedio < 10) {
    alerta = `Tu ticket medio (${eur(ticketMedio)}) es bajo. Revisa si tus precios reflejan el valor real de tus servicios.`;
  }

  return { tendencia, puntoFuerte, oportunidad, alerta };
}

function mostrarThinking(container) {
  container.innerHTML = `
  <div class="bb-result">
    <div class="bb-result-header">
      <div class="bb-result-dot thinking"></div>
      <span class="bb-result-title">BarberBrain analizando</span>
      <span class="bb-result-ts">Ahora</span>
    </div>
    <div class="bb-result-body">
      <div class="bb-thinking">
        Procesando tus datos
        <div class="bb-thinking-dots">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>`;
}

function renderizarAnalisis(container, analisis) {
  const ahora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

  const alertaHtml = analisis.alerta
    ? `<div class="bb-insight">
        <div class="bb-insight-icon">⚠️</div>
        <div class="bb-insight-body">
          <div class="bb-insight-label">Punto de atención</div>
          <div class="bb-insight-text">${analisis.alerta}</div>
        </div>
      </div>`
    : '';

  container.innerHTML = `
  <div class="bb-result">
    <div class="bb-result-header">
      <div class="bb-result-dot"></div>
      <span class="bb-result-title">Análisis completado · BarberBrain</span>
      <span class="bb-result-ts">${ahora}</span>
    </div>
    <div class="bb-result-body">
      <div class="bb-analysis">
        <div class="bb-insight">
          <div class="bb-insight-icon">📈</div>
          <div class="bb-insight-body">
            <div class="bb-insight-label">Tendencia general</div>
            <div class="bb-insight-text">${analisis.tendencia}</div>
          </div>
        </div>
        <div class="bb-insight">
          <div class="bb-insight-icon">⭐</div>
          <div class="bb-insight-body">
            <div class="bb-insight-label">Punto fuerte</div>
            <div class="bb-insight-text">${analisis.puntoFuerte}</div>
          </div>
        </div>
        <div class="bb-insight">
          <div class="bb-insight-icon">🎯</div>
          <div class="bb-insight-body">
            <div class="bb-insight-label">Oportunidad de mejora</div>
            <div class="bb-insight-text">${analisis.oportunidad}</div>
          </div>
        </div>
        ${alertaHtml}
      </div>
      <div class="bb-disclaimer" style="margin-top:.875rem">
        🧠 Análisis 100% local · Sin IA, sin conexión, sin coste · Basado en tus datos reales
      </div>
    </div>
  </div>`;
}

function lanzarBarberBrain(c1, c0, gr, best, cd, id2) {
  const btn = document.getElementById('bb-btn');
  const container = document.getElementById('bb-result-container');
  if (!btn || !container) return;

  btn.disabled = true;
  mostrarThinking(container);
  container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  setTimeout(() => {
    try {
      const analisis = generarAnalisisLocal(c1, c0, gr, best, cd, id2);
      renderizarAnalisis(container, analisis);
    } catch (err) {
      container.innerHTML = `
      <div class="bb-result">
        <div class="bb-result-header">
          <div class="bb-result-dot" style="background:var(--destructive)"></div>
          <span class="bb-result-title" style="color:var(--destructive)">Error al analizar</span>
        </div>
        <div class="bb-result-body">
          <div class="bb-insight">
            <div class="bb-insight-icon">❌</div>
            <div class="bb-insight-body">
              <div class="bb-insight-text">${err.message || 'No se pudo generar el análisis con los datos actuales.'}</div>
            </div>
          </div>
        </div>
      </div>`;
    } finally {
      btn.disabled = false;
    }
  }, 500);
}

init();
</script>
